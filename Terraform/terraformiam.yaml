AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM policy for EKS least-privilege setup including EKS, IAM, EC2, Auto Scaling, ELB, CloudWatch Logs, STS, S3, and full VPC permissions.

Resources:

  EKSFullAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: eks-full-access
      Roles:
        - !Ref EKSRoles  # attach to your existing admin/automation role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # EKS
          - Effect: Allow
            Action:
              - eks:CreateCluster
              - eks:DeleteCluster
              - eks:DescribeCluster
              - eks:ListClusters
              - eks:UpdateClusterConfig
              - eks:UpdateClusterVersion
              - eks:CreateNodegroup
              - eks:DeleteNodegroup
              - eks:DescribeNodegroup
              - eks:ListNodegroups
              - eks:UpdateNodegroupConfig
              - eks:UpdateNodegroupVersion
              - eks:CreateAddon
              - eks:UpdateAddon
              - eks:DeleteAddon
              - eks:DescribeAddon
              - eks:ListAddons
              - eks:CreateAccessEntry
              - eks:DeleteAccessEntry
              - eks:ListAccessEntries
              - eks:AssociateAccessPolicy
              - eks:DisassociateAccessPolicy
              - eks:TagResource
              - eks:UntagResource
            Resource: "*"

          # IAM strict
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:ListRoles
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:GetPolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
            Resource: "*"

          # iam:PassRole (dynamic to your existing cluster roles)
          - Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/*-cluster-role 
              - !Sub arn:aws:iam::${AWS::AccountId}:role/*-node-role 

          # EC2
          - Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:DescribeInstances
              - ec2:DescribeInstanceTypes
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:DescribeRouteTables
              - ec2:DescribeSecurityGroups
              - ec2:CreateTags
              - ec2:DeleteTags
            Resource: "*"

          # Auto Scaling
          - Effect: Allow
            Action:
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:DeleteAutoScalingGroup
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeLaunchConfigurations
            Resource: "*"

          # ELB
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:ModifyLoadBalancerAttributes
            Resource: "*"

          # CloudWatch Logs
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:DescribeLogGroups
              - logs:PutRetentionPolicy
            Resource: "*"

          # STS
          - Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

          # S3 (EKS related only)
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
            Resource: "*"

          # VPC (full permissions)
          - Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:DescribeVpcs
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:DescribeSubnets
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:DescribeRouteTables
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:DescribeInternetGateways
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:DescribeNatGateways
              - ec2:CreateNetworkAcl
              - ec2:DeleteNetworkAcl
              - ec2:DescribeNetworkAcls
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
            Resource: "*"
